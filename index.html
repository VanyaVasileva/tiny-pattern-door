<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Open the Tiny Pattern Door</title>
<style>
  :root { --cream:#f6f0e7; --ink:#3f3a34; --wood:#b99a79; --wood2:#9c7f62; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; background:var(--cream); color:var(--ink); }
  body { display:grid; place-items:center; }
  .app { position:relative; width:100vw; height:100svh; min-height:100vh; overflow:hidden; background:linear-gradient(#f8f3ec,#f1e7dc); }
  .pattern { position:absolute; inset:0; background:url('mouse-mail-pattern.jpg') center/cover no-repeat; transform:scale(1.02); }
  .veil { position:absolute; inset:0; background:rgba(246,240,231,.20); transition:opacity .8s ease; }
  .frame { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(78vw,430px); aspect-ratio:0.68; perspective:1200px; filter:drop-shadow(0 18px 28px rgba(70,52,38,.20)); }
  .doorway { position:absolute; inset:0; border:12px solid #d6c2aa; border-bottom-width:18px; border-radius:24px 24px 10px 10px; overflow:visible; background:#d8c6b4; }
  .door { position:absolute; top:0; bottom:0; width:50%; background:linear-gradient(90deg,var(--wood2),var(--wood)); border:2px solid rgba(70,52,38,.25); transition:transform 1.15s cubic-bezier(.2,.75,.2,1); transform-style:preserve-3d; backface-visibility:hidden; }
  .door::before { content:""; position:absolute; inset:8%; border:2px solid rgba(255,255,255,.28); border-radius:8px; box-shadow:inset 0 0 0 1px rgba(70,52,38,.12); }
  .left { left:0; transform-origin:left center; border-radius:10px 0 0 6px; }
  .right { right:0; transform-origin:right center; border-radius:0 10px 6px 0; }
  .knob { position:absolute; top:50%; width:16px; height:16px; border-radius:50%; background:#6d5c4c; box-shadow:0 1px 4px rgba(0,0,0,.25); z-index:4; }
  .left .knob { right:12px; } .right .knob { left:12px; }
  .sign { position:absolute; left:50%; top:10%; transform:translateX(-50%); z-index:7; padding:10px 17px; border-radius:999px; background:rgba(255,255,255,.88); backdrop-filter:blur(6px); font-size:clamp(15px,4vw,19px); letter-spacing:.02em; box-shadow:0 6px 18px rgba(70,52,38,.13); transition:opacity .35s ease, transform .35s ease; white-space:nowrap; }
  .hint { position:absolute; left:50%; bottom:7%; transform:translateX(-50%); z-index:7; text-align:center; font-size:14px; opacity:.72; transition:opacity .35s ease; width:90%; }
  .tap { position:absolute; inset:0; z-index:10; cursor:pointer; border:0; background:transparent; -webkit-tap-highlight-color:transparent; }
  .reveal-copy { position:absolute; left:50%; bottom:6%; transform:translate(-50%,16px); z-index:6; text-align:center; opacity:0; transition:all .65s ease .65s; width:88%; text-shadow:0 1px 8px white; }
  .reveal-copy h1 { margin:0; font-size:clamp(25px,7vw,42px); font-weight:650; }
  .reveal-copy p { margin:6px 0 0; font-size:clamp(14px,3.8vw,18px); }
  .sparkle { position:absolute; width:8px; height:8px; border-radius:50%; background:white; opacity:0; z-index:5; box-shadow:0 0 12px 5px rgba(255,255,255,.85); }
  .s1{left:20%;top:25%}.s2{right:17%;top:34%}.s3{left:28%;bottom:27%}.s4{right:26%;bottom:20%}
  .open .left { transform:rotateY(-105deg); }
  .open .right { transform:rotateY(105deg); }
  .open .sign { opacity:0; transform:translate(-50%,-10px); }
  .open .hint { opacity:0; }
  .open .veil { opacity:0; }
  .open .reveal-copy { opacity:1; transform:translate(-50%,0); }
  .open .sparkle { animation:twinkle 1.8s ease-in-out .7s 2; }
  @keyframes twinkle { 0%,100%{opacity:0;transform:scale(.2)} 40%{opacity:1;transform:scale(1)} }
  @media (min-width:700px){ .app{max-width:520px; height:min(92vh,900px); border-radius:28px; box-shadow:0 24px 70px rgba(0,0,0,.18)} }
</style>
</head>
<body>
<main class="app" id="app" aria-label="Interactive pattern reveal">
  <div class="pattern"></div><div class="veil"></div>
  <div class="sparkle s1"></div><div class="sparkle s2"></div><div class="sparkle s3"></div><div class="sparkle s4"></div>
  <div class="frame" aria-hidden="true">
    <div class="doorway">
      <div class="door left"><span class="knob"></span></div>
      <div class="door right"><span class="knob"></span></div>
    </div>
  </div>
  <div class="sign">Tap to open ✨</div>
  <div class="hint">What is hiding behind the tiny door?</div>
  <div class="reveal-copy"><h1>Mouse Mail</h1><p>New pattern coming soon</p></div>
  <button class="tap" id="tap" aria-label="Open or close the tiny pattern door"></button>
</main>
<script>
  const app = document.getElementById('app');
  const tap = document.getElementById('tap');
  tap.addEventListener('click', () => app.classList.toggle('open'));
</script>
</body>
</html>
